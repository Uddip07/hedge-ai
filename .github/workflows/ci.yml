name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Formatting Check (Black)
        run: |
          black --check .

      - name: Code Linting (Ruff)
        run: |
          ruff check .

      - name: Static Type Checking (mypy)
        run: |
          mypy packages/

      - name: Run Pytest Unit Test Suite
        run: |
          pytest --cov=packages tests/

      - name: Run Master Domain Architecture Verifier
        run: |
          python tests/verify_all_domain.py
